# Single API replica behind an HTTPS reverse proxy; external PostgreSQL/R2/SMTP.
# Supply A7_BACKEND_ENV_FILE as an absolute path outside the repository.
services:
  api:
    image: a7-property-api:${A7_RELEASE_TAG:?Set an immutable release tag}
    build:
      context: .
      target: runtime
    env_file:
      - ${A7_BACKEND_ENV_FILE:?Set the production secret file path}
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tools:
    image: a7-property-tools:${A7_RELEASE_TAG:?Set an immutable release tag}
    build:
      context: .
      target: tools
    profiles: ["release"]
    env_file:
      - ${A7_BACKEND_ENV_FILE:?Set the production secret file path}
    environment:
      NODE_ENV: production
    init: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
