services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a7_property}
      POSTGRES_USER: ${POSTGRES_USER:-a7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - a7_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a7} -d ${POSTGRES_DB:-a7_property}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared rate-limit counters. Optional for a single API replica; set
  # REDIS_URL=redis://localhost:6379 in backend/.env to use it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a7_postgres_data:
